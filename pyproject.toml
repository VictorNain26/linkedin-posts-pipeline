[project]
name = "linkedin-posts-pipeline"
version = "1.0.0"
description = "Pipeline autonome LinkedIn — 8 agents Claude, multi-format, analytics"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Victor Lenain" }]

# ── Deps PRODUCTION (source unique de vérité) ──
# requirements.txt est généré depuis cette section. Ne PAS éditer requirements.txt
# manuellement — voir scripts/sync_requirements.sh.
dependencies = [
    "anthropic>=0.101.0",
    "feedparser>=6.0.12",
    "requests>=2.34.0",
    # Extraction du corps d'article (sans boilerplate) pour le grounding factuel des agents
    "trafilatura>=2.0.0",
    "python-dotenv>=1.2.2",
    # Dashboard Streamlit + analytics
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "pypdfium2>=4.30.0",
    # Lecture XLSX LinkedIn Analytics export
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
# ── Deps DEV (pas dans requirements.txt, installées via `pip install -e ".[dev]"`) ──
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "mypy>=2.1.0",
    "types-requests",
    "pip-tools>=7.4.0",  # pour générer requirements.txt depuis pyproject.toml
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

# Flat-layout application — modules Python à la racine, pas de "package" distribuable.
# On liste explicitement les modules pour éviter que setuptools tente
# de "discover" docker/ et templates/ comme packages.
[tool.setuptools]
py-modules = [
    "anthropic_client",
    "config",
    "format_selector",
    "generate_post",
    "history",
    "linkedin_analytics",
    "linkedin_post",
    "oauth_setup",
    "rss_fetch",
    "token_refresh",
    "weekly_report",
]

# ──────────────────────────────────────────────────────────────
# Ruff : linter + formatter (remplace black + isort + flake8 + pyupgrade)
# ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = [".venv", "data", "output", "logs", ".claude"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear (anti-patterns)
    "UP",       # pyupgrade (use modern syntax)
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PL",       # pylint
    "S",        # bandit (security)
]
ignore = [
    "PLR0913",  # too many args
    "PLR2004",  # magic numbers (utilisés expressément dans config)
    "S101",     # assert (utilisé en tests + smoke checks)
    "E501",     # line too long (déjà géré par formatter)
]

[tool.ruff.lint.per-file-ignores]
# tests : asserts + fake creds + imports lazy (pour reload modules)
"tests/*" = ["S101", "S105", "S106", "PLC0415"]
"tests/conftest.py" = ["E402"]  # imports après env setup

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ──────────────────────────────────────────────────────────────
# Mypy : type checking strict mais pragmatique
# ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = false  # gradual typing
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true  # feedparser, anthropic typings parfois manquants

# ──────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # SQLite connections finalized by GC after test fixture cleanup — noise harmless
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "oauth_setup.py",       # interactif, pas testable unitairement
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
