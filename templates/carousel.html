<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  /* ────────────────────────────────────────────────────────────────
     Design carousel LinkedIn 2026
     - Format portrait 4:5 (1080x1350) — mobile-first
     - Headlines >= 60px (best practice mobile readability)
     - Body >= 24px
     - Whitespace généreux ("billboards not textbook pages")
     - Pattern interrupt slides milieu (background inversé) → -31% drop-off
     - Palette : dark base + accent bleu Victor (#3b82f6)
     - Logo persistant en haut chaque slide
  ──────────────────────────────────────────────────────────────── */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'Inter';
    src: local('Inter'), local('Helvetica Neue'), local('Arial');
  }

  body {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background: #0a0a0f;
    color: #f0f0f5;
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 1080px;
    height: 1350px;
    padding: 100px 90px 90px;
    page-break-after: always;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .slide:last-child { page-break-after: auto; }

  /* ── Header logo persistant ── */
  .header {
    display: flex;
    align-items: center;
    gap: 18px;
    height: 60px;
  }
  .header img {
    width: 60px;
    height: 60px;
    border-radius: 12px;
  }
  .header .brand {
    font-size: 22px;
    font-weight: 700;
    color: #f0f0f5;
    letter-spacing: -0.01em;
  }
  .header .brand-sub {
    font-size: 14px;
    color: #6b7280;
    font-weight: 500;
    margin-top: 2px;
  }
  .header-text { display: flex; flex-direction: column; }

  /* ── Slide number ── */
  .slide-number {
    position: absolute;
    top: 100px;
    right: 90px;
    font-size: 16px;
    color: #4b5563;
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  /* ── Footer (CTA visuel pour swipe) ── */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    color: #6b7280;
    font-weight: 500;
  }
  .footer .swipe {
    color: #3b82f6;
    font-weight: 600;
  }

  /* ── Contenu principal centré ── */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 0;
  }

  .accent-bar {
    width: 80px;
    height: 6px;
    background: #3b82f6;
    border-radius: 3px;
    margin-bottom: 48px;
  }

  /* ── Slide 1 : Cover, gros impact ── */
  .slide-cover .main-text {
    font-size: 76px;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: #f0f0f5;
  }
  .slide-cover .sub-text {
    font-size: 30px;
    line-height: 1.4;
    color: #9ca3af;
    margin-top: 36px;
    font-weight: 400;
  }
  .slide-cover .accent-bar {
    background: #3b82f6;
    width: 120px;
    height: 8px;
  }

  /* ── Slides body : standard ── */
  .slide-body .main-text {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.02em;
    color: #f0f0f5;
  }
  .slide-body .sub-text {
    font-size: 28px;
    line-height: 1.5;
    color: #9ca3af;
    margin-top: 32px;
    font-weight: 400;
  }

  /* ── Pattern interrupt : slide claire au milieu pour réveiller l'œil ── */
  .slide-interrupt {
    background: #f0f0f5;
    color: #0a0a0f;
  }
  .slide-interrupt .main-text { color: #0a0a0f; }
  .slide-interrupt .sub-text { color: #4b5563; }
  .slide-interrupt .header .brand { color: #0a0a0f; }
  .slide-interrupt .header .brand-sub { color: #6b7280; }
  .slide-interrupt .slide-number { color: #9ca3af; }
  .slide-interrupt .footer { color: #6b7280; }
  .slide-interrupt .footer .swipe { color: #3b82f6; }
  .slide-interrupt .accent-bar { background: #3b82f6; }

  /* ── Slide CTA finale ── */
  .slide-cta .main-text {
    font-size: 60px;
    font-weight: 800;
    line-height: 1.15;
    color: #3b82f6;
    letter-spacing: -0.02em;
  }
  .slide-cta .sub-text {
    font-size: 26px;
    color: #d1d5db;
    margin-top: 36px;
    line-height: 1.5;
  }
  .slide-cta .accent-bar {
    background: #3b82f6;
    width: 120px;
  }

  /* ── Save cue (slide finale uniquement) ── */
  .save-cue {
    margin-top: 60px;
    padding: 22px 28px;
    background: rgba(59, 130, 246, 0.12);
    border-left: 4px solid #3b82f6;
    border-radius: 8px;
    font-size: 22px;
    color: #93c5fd;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .save-cue-badge {
    display: inline-block;
    padding: 6px 12px;
    background: #3b82f6;
    color: #f0f0f5;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    border-radius: 4px;
  }
  /* Variante save-cue sur fond clair (pattern interrupt) */
  .slide-interrupt .save-cue {
    background: rgba(59, 130, 246, 0.10);
    color: #1e40af;
  }
</style>
</head>
<body>
  {{SLIDES_HTML}}
</body>
</html>
