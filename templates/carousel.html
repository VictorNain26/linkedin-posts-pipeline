<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  /* ────────────────────────────────────────────────────────────────
     Design carousel LinkedIn 2026
     - Format portrait 4:5 (1080x1350) — mobile-first
     - Fond dark uniforme (#0a0a0f)
     - Cover slide : design "magazine cover" distinctif
     - Body slides : layout simple, focus contenu
     - CTA slide : couleur accent + bouton visuel
     - Logo light en haut chaque slide (sauf cover qui a son propre layout)
  ──────────────────────────────────────────────────────────────── */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background: #0a0a0f;
    color: #f0f0f5;
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 1080px;
    height: 1350px;
    padding: 100px 90px 90px;
    page-break-after: always;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #0a0a0f;
  }
  .slide:last-child { page-break-after: auto; }

  /* ──────────────────────────────────────────────
     Cover slide (magazine cover style)
  ────────────────────────────────────────────── */
  .slide-cover {
    justify-content: space-between;
    background:
      radial-gradient(ellipse 800px 600px at 20% 0%, rgba(59, 130, 246, 0.18), transparent 70%),
      radial-gradient(ellipse 600px 800px at 100% 100%, rgba(59, 130, 246, 0.08), transparent 60%),
      #0a0a0f;
  }
  .cover-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .cover-edition {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #3b82f6;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }
  .cover-edition::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 3px;
    background: #3b82f6;
    border-radius: 2px;
  }
  .cover-number {
    font-size: 96px;
    font-weight: 800;
    color: rgba(59, 130, 246, 0.25);
    line-height: 1;
    letter-spacing: -0.04em;
  }
  .cover-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
  }
  .cover-center .main-text {
    font-size: 92px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.035em;
    color: #f0f0f5;
  }
  .cover-center .sub-text {
    font-size: 32px;
    line-height: 1.4;
    color: #9ca3af;
    margin-top: 40px;
    font-weight: 400;
    max-width: 700px;
  }
  .cover-signature {
    display: flex;
    align-items: center;
    gap: 20px;
    padding-top: 32px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .cover-signature img {
    width: 64px;
    height: 64px;
    border-radius: 14px;
  }
  .cover-signature .sig-text {
    display: flex;
    flex-direction: column;
  }
  .cover-signature .sig-name {
    font-size: 22px;
    font-weight: 700;
    color: #f0f0f5;
    letter-spacing: -0.01em;
  }
  .cover-signature .sig-role {
    font-size: 15px;
    color: #6b7280;
    font-weight: 500;
    margin-top: 2px;
  }
  .cover-signature .sig-swipe {
    margin-left: auto;
    font-size: 16px;
    color: #3b82f6;
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  /* ──────────────────────────────────────────────
     Body slides (slides 2 → N-1)
  ────────────────────────────────────────────── */
  .slide-body { justify-content: space-between; }

  .header {
    display: flex;
    align-items: center;
    gap: 18px;
    height: 60px;
  }
  .header img {
    width: 56px;
    height: 56px;
    border-radius: 12px;
  }
  .header-text { display: flex; flex-direction: column; }
  .header .brand {
    font-size: 20px;
    font-weight: 700;
    color: #f0f0f5;
    letter-spacing: -0.01em;
  }
  .header .brand-sub {
    font-size: 13px;
    color: #6b7280;
    font-weight: 500;
    margin-top: 2px;
  }

  .slide-number {
    position: absolute;
    top: 100px;
    right: 90px;
    font-size: 16px;
    color: #4b5563;
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    color: #6b7280;
    font-weight: 500;
  }
  .footer .swipe {
    color: #3b82f6;
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 0;
  }
  .accent-bar {
    width: 72px;
    height: 5px;
    background: #3b82f6;
    border-radius: 3px;
    margin-bottom: 44px;
  }

  .slide-body .main-text {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.02em;
    color: #f0f0f5;
  }
  .slide-body .sub-text {
    font-size: 28px;
    line-height: 1.5;
    color: #9ca3af;
    margin-top: 32px;
    font-weight: 400;
  }

  /* ──────────────────────────────────────────────
     CTA slide finale
  ────────────────────────────────────────────── */
  .slide-cta {
    justify-content: space-between;
    background:
      radial-gradient(ellipse 700px 500px at 50% 50%, rgba(59, 130, 246, 0.20), transparent 70%),
      #0a0a0f;
  }
  .slide-cta .main-text {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.12;
    color: #3b82f6;
    letter-spacing: -0.025em;
  }
  .slide-cta .sub-text {
    font-size: 28px;
    color: #d1d5db;
    margin-top: 36px;
    line-height: 1.5;
  }
  .slide-cta .accent-bar {
    background: #3b82f6;
    width: 120px;
    height: 6px;
  }

  /* Badge ASTUCE pour save cue */
  .save-cue {
    margin-top: 56px;
    padding: 22px 28px;
    background: rgba(59, 130, 246, 0.12);
    border-left: 4px solid #3b82f6;
    border-radius: 8px;
    font-size: 22px;
    color: #93c5fd;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .save-cue-badge {
    display: inline-block;
    padding: 6px 12px;
    background: #3b82f6;
    color: #f0f0f5;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    border-radius: 4px;
  }
</style>
</head>
<body>
  {{SLIDES_HTML}}
</body>
</html>
