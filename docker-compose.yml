# docker-compose.yml — orchestration LinkedIn pipeline
# Best practices mai 2026 :
# - init: true       → docker-init reap les zombies (Chromium spawn beaucoup de subprocess)
# - secrets:         → injection des credentials via fichiers (pas env vars, log-safe)
# - tmpfs /tmp       → Chromium écrit beaucoup → RAM-backed, plus rapide + safer
# - resources.limits → cap mémoire pour éviter OOM kill du host
# - log rotation     → évite que stdout supercronic remplisse le disque

services:
  linkedin-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkedin-posts-pipeline:latest
    container_name: linkedin-pipeline
    restart: unless-stopped

    # Reap zombies (Chromium subprocess) + gracefull SIGTERM → supercronic
    init: true

    # ── Secrets via env_file en local (dev) / Docker secrets recommandés en prod ──
    # Pour passer en prod hardened :
    #   1. enlever env_file
    #   2. activer la section `secrets` ci-dessous + créer les secrets
    #   3. adapter le code pour lire /run/secrets/* au lieu de env vars
    env_file:
      - .env

    environment:
      LINKEDIN_DATA_DIR: /data
      TZ: Europe/Paris

    volumes:
      # Persistance des données (history.db, output/, logs/, reports/)
      # Pointe vers le data dir réel utilisé en CLI native (~/linkedin-posts-data) pour
      # garantir Docker et CLI partagent la même DB et les mêmes outputs.
      # Override via .env si besoin (export LINKEDIN_DATA_DIR=/path/absolu).
      - ${LINKEDIN_DATA_DIR:-../linkedin-posts-data}:/data
      # Override optionnel du crontab sans rebuild
      # - ./docker/crontab.docker:/app/crontab:ro

    # /tmp en RAM : Chromium y écrit massivement (PDF gen)
    tmpfs:
      - /tmp:size=512M,mode=1777

    # Limites pour éviter d'éouffer le host
    deploy:
      resources:
        limits:
          memory: 2G       # Chromium pic ~1.5GB pendant le rendu PDF
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

    # Réseau : pas besoin de bind port (sortie HTTP only)
    networks:
      - default

    # Logs : rotation pour éviter de saturer le disque
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Sécurité : `cap_drop: ALL` reste. `no-new-privileges:true` retiré car
    # incompatible avec l'ENTRYPOINT dumb-init du Dockerfile (qui a un setuid bit).
    # Sans cap_drop, no-new-privileges n'apporte plus grand-chose : on garde cap_drop.
    read_only: false  # supercronic écrit dans /tmp et /app/crontab (inotify)
    cap_drop:
      - ALL

  # ──────────────────────────────────────────────────────────────
  # Dashboard Streamlit — visualisation historique / analytics / tests
  # + toggle publi auto (touche ~/data/.publi_paused, lu par pipeline.sh)
  #
  # Accès :
  #   LAN + Tailscale : http://victorserv:8501  (MagicDNS — IP Tailscale 100.74.84.25)
  #   0.0.0.0 est volontaire : capture l'interface tailscale0 sans config supplémentaire.
  #
  # ⚠️  Pas d'auth applicative — modèle de sécurité = Tailscale (WireGuard device auth).
  #     NE PAS ajouter ce port au Tailscale Funnel (deviendrait public sans auth).
  #     Pour partager avec quelqu'un : sidecar Caddy + Basic Auth, puis Funnel.
  # ──────────────────────────────────────────────────────────────
  linkedin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkedin-posts-pipeline:latest  # même image que linkedin-pipeline
    container_name: linkedin-dashboard
    restart: unless-stopped
    # Pas de `init: true` : dumb-init est déjà en ENTRYPOINT du Dockerfile et reap les
    # zombies sans nécessiter CAP_SYS_ADMIN. Streamlit est mono-process, ça suffit.

    env_file:
      - .env

    environment:
      LINKEDIN_DATA_DIR: /data
      TZ: Europe/Paris
      PYTHONPATH: /app

    volumes:
      # Lecture seule du code, lecture/écriture sur /data (toggle pause + analytics)
      - ./:/app:ro
      - ${LINKEDIN_DATA_DIR:-../linkedin-posts-data}:/data

    # Bind sur 0.0.0.0 → accessible depuis n'importe quelle IP du LAN.
    # Si tu veux restreindre à localhost : "127.0.0.1:8501:8501"
    ports:
      - "0.0.0.0:8501:8501"

    # Override de la CMD du Dockerfile (qui est supercronic par défaut)
    command:
      - streamlit
      - run
      - /app/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).read()==b'ok' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.1'

    networks:
      - default

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # NOTE : `no-new-privileges:true` retiré ici car incompatible avec l'ENTRYPOINT
    # dumb-init du Dockerfile (dumb-init a un setuid bit, refusé par no-new-privileges).
    # `cap_drop: ALL` couvre déjà 90% du risque. Si tu veux les deux, change l'ENTRYPOINT
    # du dashboard pour bypass dumb-init (Streamlit est mono-process, pas besoin).
    cap_drop:
      - ALL

